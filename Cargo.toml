[package]
name = "burn-ttt"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Test-Time Training for Burn — learn from context at inference time (TTT-E2E)"
keywords = ["burn", "test-time-training", "ttt", "long-context", "continual-learning"]
repository = "https://github.com/sehaxe/burn-ttt"
homepage = "https://github.com/sehaxe/burn-ttt"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]

[dependencies]
burn = { version = "0.21", default-features = false }
burn-tensor = "0.21"

[dev-dependencies]
burn-ndarray = { version = "0.21", features = ["blas-openblas"] }
burn = { version = "0.21", features = ["ndarray"] }
